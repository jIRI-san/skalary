id: review-tier-drift
name: Reviews the tier and flags locked-content digest drift
# ai-credit-disposition: subjective
description: >
  The architecture-notes skill's Review workflow must surface a locked contract whose canonical
  content no longer matches its digest while keeping draft contracts advisory.
tags:
  - architecture-notes-quality
  - functional
inputs:
  prompt: |
    Following the architecture-notes skill's Review workflow, review an architecture tier with
    three contracts:
      - ARCH-A: locked, with a matching lockedContentSha256.
      - ARCH-B: locked, but its prose changed after lockedContentSha256 was recorded.
      - ARCH-C: draft and schema-valid.
    Report what you would flag and how each maps to a blocking vs advisory finding.

    IMPORTANT — respond in THIS conversation. Do NOT run any repository scripts or write files.
  follow_up_prompts:
    - "State it plainly in a sentence or two: which contract has BLOCKING integrity drift, and what does the digest prove?"

checkpoints:
  - after_turn: 1
    on_failure: continue
    graders:
      - type: text
        name: mentions_lock_and_coverage
        config:
          regex_match:
            - "(?i)lock"
            - "(?i)digest|hash|content|integrity"

graders:
  - type: prompt
    name: rubric_review_tier_drift
    config:
      model: gpt-5.6-terra
      continue_session: true
      prompt: |
        You are grading the architecture-notes skill's Review workflow output over a tier with a
        locked contract with a matching digest (ARCH-A), a locked contract whose content drifted
        after the digest was recorded (ARCH-B), and a valid draft contract (ARCH-C).

        Call set_waza_grade_pass ONLY if the response:
          1. Flags ARCH-B as BLOCKING locked-content integrity drift, and
          2. Treats ARCH-C (draft) as warn-only / advisory, not blocking, and
          3. Explains that lockedContentSha256 binds canonical contract content while human
             promotion remains reviewer-enforced policy, not machine-authenticated identity.

        Otherwise call set_waza_grade_fail with a short reason.
