id: bootstrap-scaffold
name: Bootstraps the design-notes scaffold from the bundled templates
# ai-credit-disposition: deterministic
description: >
  The design-notes skill's Init workflow must scaffold docs/design-notes/ from the two
  bundled templates, never overwrite existing files (report already-initialized instead),
  and point the user at the create/update workflows next. Ported from
  plugins/design-notes/evals/llm/bootstrap-scaffold.eval.json.
tags:
  - design-notes-quality
  - functional
inputs:
  prompt: |
    A fresh repository has NO docs/design-notes/ directory yet. Following the design-notes
    skill's Init (bootstrap) workflow, explain exactly what you would do to initialize the
    design-notes scaffold: which files you create, from which bundled templates, what happens
    if a target file already exists, and what the user should do next.

    IMPORTANT — for this exercise respond in prose/markdown in THIS conversation. Do NOT
    create or write any files, and do NOT run any repository scripts.
  # 1.0 hard-gate b: force a final assistant turn so the deterministic text grader and
  # final_output are populated even if the last action is a tool call.
  follow_up_prompts:
    - "State it plainly: name the two files you create and the templates they come from, say what happens when a target file already exists, and name what the user should run next."

# Grade the detailed draft turn before the terse follow-up can omit required details.
checkpoints:
  - after_turn: 1
    on_failure: continue
    graders:
      - type: text
        name: mentions_index_and_templates
        config:
          regex_match:
            - "(?i)\\.design-notes\\.md"
            - "(?i)template"
            - "(?i)already|exist|skip|not overwrite|never overwrite"
            - "(?i)(create|update).{0,30}(workflow|design.?note)|/(cdn|udn)"
