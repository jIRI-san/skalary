id: update-design-note
name: Updates an existing note for sandboxed evals, calling out a trade-off
description: >
  The design-notes skill's Update workflow must produce an update-oriented response (edits to
  an existing note, not a new unrelated doc), call out at least one limitation or trade-off of
  sandboxed eval execution, and stay focused on design-note content rather than code. Ported
  from plugins/design-notes/evals/llm/update-design-note.eval.json.
tags:
  - design-notes-quality
  - functional
inputs:
  # An EXISTING design note is copied into the disposable workspace so the Update workflow has a
  # real file to edit. Without it the agent finds an empty workspace and drafts a brand-new note,
  # which the judge (correctly) fails on criterion 1 — the 5.1 live-sweep flake root cause.
  context:
    fixture: fixtures/existing-eval-note.design.md
  prompt: |
    A change just introduced sandboxed LLM evals: each eval now runs in a disposable,
    isolated workspace. Following the design-notes skill's Update workflow, update the EXISTING
    design note existing-eval-note.design.md (in your working directory) — edit its relevant
    section(s) to reflect the new contracts, constraints, and known limitations this introduces.

    IMPORTANT — for this exercise reason about the note shown in the file and respond with the
    proposed edits / updated section in THIS conversation. You may READ the file, but do NOT
    create or write any files, do NOT run any repository scripts, and do NOT output
    implementation code.
  # 1.0 hard-gate b: force a final assistant turn so final_output is populated even if the last
  # action is a tool call. The deterministic text pre-check is graded at the draft turn (see
  # checkpoints); the judge resumes the session at the final turn.
  follow_up_prompts:
    - "State it plainly in a sentence or two: name which existing section you updated for the new sandboxed/isolated eval workspace, and the one limitation or trade-off of sandboxed eval execution you called out."

# Deterministic pre-check (0 judge tokens) graded at the DRAFT turn (after_turn: 1), robust to
# paraphrase in the terse final turn (5.1 live-sweep finding). on_failure: continue so the judge
# still runs at the final turn.
checkpoints:
  - after_turn: 1
    on_failure: continue
    graders:
      - type: text
        name: mentions_sandbox_and_tradeoff
        config:
          regex_match:
            - "(?i)sandbox|isolat|disposable|throwaway|ephemeral|clone|workspace"
            - "(?i)limitation|trade-?off|caveat|constraint|risk|downside"

graders:
  # Ported rubric[] -> LLM judge. continue_session: true so the judge RESUMES the agent's
  # session and deterministically sees the full update in context. Binary pass/fail via
  # set_waza_grade_pass/fail.
  - type: prompt
    name: rubric_update_design_note
    config:
      model: claude-sonnet-4.6
      continue_session: true
      prompt: |
        You are grading the design-notes skill's Update workflow output — an update to an
        existing design note reflecting newly-introduced sandboxed LLM evals.

        Call set_waza_grade_pass ONLY if the response:
          1. Is UPDATE-oriented — edits/changes to an existing note — not a brand-new,
             unrelated document, and
          2. Calls out at least one limitation or trade-off introduced by sandboxed eval
             execution, and
          3. Stays focused on design-note content (contracts, constraints, limitations)
             rather than implementation code.

        Otherwise call set_waza_grade_fail with a short reason.
