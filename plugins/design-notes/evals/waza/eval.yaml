name: design-notes
description: Tier-2 LLM evals for the design-notes skill — bootstrap scaffold, create a new design note, and update notes from the session, graded on describe-only reasoning quality.
skill: design-notes
schemaVersion: "1.2"
version: "1.0"

config:
  executor: copilot-sdk
  model: claude-sonnet-4.6
  judge_model: claude-sonnet-4.6
  trials_per_task: 2
  timeout_seconds: 300
  parallel: false
  # design-notes is a SKILL (plugins/design-notes/skills/design-notes/SKILL.md). Resolve the
  # REAL skill bundle relative to this eval.yaml (1.0 soft-gate c: skill_directories resolves
  # from the spec file). ../../skills is plugins/design-notes/skills, which contains the
  # `design-notes` skill dir discovered by the `skill:` name above.
  skill_directories:
    - ../../skills
  # inject_skill_body defaults to true (1.0 gate e): the SKILL.md body is injected into the
  # system prompt so the agent carries the design-notes discipline (Init/Create/Update
  # dispatch, governance-file reading, no-overwrite bootstrap). design-notes declares
  # disable-model-invocation: true, so body injection — not a `skill` tool call — is what
  # exercises the behaviour; these cases measure the described OUTPUT, not tool invocation.

tasks:
  - tasks/*.yaml

# No spec-level tool_constraint: the design-notes SKILL.md frontmatter declares NO `tools:`
# field, so waza auto-injects nothing to suppress (contrast cr/dr agent frontmatter listing VS
# Code tool names). All three cases are describe-only reasoning scenarios graded on the
# response, so no positive tool_calls assertion applies either (contrast ci's
# execute-step-atomically).

# No adversarial block: all three ported design-notes cases are functional output-quality
# scenarios, not prompt-injection cases.
