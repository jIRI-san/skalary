id: capture-consequential-ambiguity
name: Captures selected wording while asking only about consequential ambiguity
# ai-credit-disposition: subjective
description: >
  cip must preserve the operator's exact selected wording, distinguish confirmed scope
  from bounded discretion and intentional deferral, and ask one focused question when
  two materially different meanings remain. This transcript-style scenario measures
  intent capture without inventing a confirmation.
tags:
  - intent-alignment
  - ambiguity
  - functional
inputs:
  prompt: |
    Prepare the next planning response from this short operator transcript:

    operator: "Refresh the active record on save."
    operator: "Only the active record is in scope; do not add batch refresh."
    Confirmed criterion: A successful save refreshes the active record without
    affecting other records.
    Bounded discretion: Choose a debounce interval from 200–500 ms; this is not an
    acceptance decision.
    Deferred: Persisting refresh work across process restarts is out of scope unless
    the existing implementation cannot meet the criterion; ask the operator before adding
    durable storage.

    The word "refresh" could mean updating the visible client view from the save
    response, or fetching canonical state again from the server. These have different
    stale-data and conflict behavior. Respond in prose only. Do not create or modify
    files, run scripts, or invent an answer for the operator.
  follow_up_prompts:
    - "State the captured wording, what is confirmed, what remains bounded or deferred, and ask only the one unresolved consequential question."

graders:
  - type: text
    name: identifies_intent_and_open_question
    config:
      regex_match:
        - "(?i)refresh the active record on save"
        - "(?i)question|clarif|which|whether"
        - "(?i)debounce|200.?500|bounded"
        - "(?i)defer|restart|persist"
  - type: prompt
    name: rubric_distinguishes_confirmed_discretion_and_ambiguity
    config:
      model: gpt-6.1-sol
      continue_session: true
      prompt: |
        Call set_waza_grade_pass ONLY if the response preserves the exact selected
        wording "Refresh the active record on save," distinguishes the confirmed
        active-record-only scope from the two materially different meanings of
        "refresh," and asks one focused question about whether to update from the save
        response or fetch canonical server state. It must record the 200–500 ms
        debounce as authorized bounded discretion, not an operator question, and keep
        restart persistence deferred unless the current implementation requires it,
        in which case the operator must decide before durable storage is added. It must not
        claim either refresh meaning has already been confirmed or broaden to batch
        work. Otherwise call set_waza_grade_fail with a short reason.
