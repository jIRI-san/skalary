id: push-back-on-vague-scope
name: Pushes back on vague scope instead of fabricating a plan
# ai-credit-disposition: subjective
description: >
  Given an under-specified brief with no subsystem boundaries or acceptance criteria,
  cip must recognise the ambiguity, request the concrete missing information, and refuse
  to fabricate detailed implementation steps before scope is clarified. Revised from
  plugins/create-implementation-plan/evals/llm/push-back-on-vague-scope.eval.json.
tags:
  - scope-discipline
  - functional
inputs:
  prompt: |
    Create an implementation plan for this request: "improve reliability."

    That is the entire brief — there are no subsystem boundaries, no target components,
    no acceptance criteria, and no definition of what "reliability" means here.

    Respond in prose in THIS conversation. Do NOT run Test-Plan.ps1, Set-PlanStage.ps1,
    launch.ps1, or any other repository scripts, and do NOT create or write any files.
  # 1.0 hard-gate b: force a final assistant turn so the deterministic text grader and
  # final_output are populated even if the last action is a tool call.
  follow_up_prompts:
    - "State plainly what specific information you need before you can produce a reliable plan, and confirm you are NOT fabricating detailed implementation steps yet."

graders:
  # Cheap deterministic pre-check: a genuine push-back declines to plan, identifies a
  # consequential missing scope dimension, and does not start fabricating a solution.
  - type: text
    name: flags_ambiguity_and_requests_scope
    config:
      regex_match:
        - "(?i)information needed|not\\b.{0,15}fabricat|before .{0,40}plan|need .{0,25}(before|more|detail)|too (broad|vague)|under-?specified|ambig"
        - "(?i)measurable|success (metric|criteri|outcome)|acceptance|scope|constraint|requirement|failure (mode|definition)|which (system|codebase|component)|clarif"
      regex_not_match:
        - "(?im)^\\s*(?:phase|step)\\s+\\d+"
        - "(?i)create (?:a|the) (?:service|module|endpoint|class|database)"
  - type: prompt
    name: rubric_scope_refusal_without_fabrication
    config:
      model: gpt-6.1-sol
      continue_session: true
      prompt: |
        Grade a planning assistant's response to the entire brief "improve reliability,"
        with no subsystem boundary, target behavior, failure definition, or acceptance
        criterion. Call set_waza_grade_pass ONLY if the response:
          1. Declines to fabricate a detailed implementation plan until the material goal
             and target are clarified,
          2. Asks one focused clarifying question that seeks concrete target/success
             information rather than presenting a questionnaire, and
          3. Does not invent repository files, architecture, dependencies, or implementation
             steps.
        A concise explanation of why the missing information changes the plan is useful.
        Do not penalize the assistant for offering examples of useful success measures.
        Otherwise call set_waza_grade_fail with a short reason.
