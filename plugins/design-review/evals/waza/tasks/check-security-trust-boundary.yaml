id: check-security-trust-boundary
name: Identifies a trust-boundary/security risk
# ai-credit-disposition: deterministic
description: >
  dr must identify the trust-boundary risk in executing untrusted model output as
  shell commands, recommend safer handling, and rate it as material. Ported from
  plugins/design-review/evals/llm/check-security-trust-boundary.eval.json.
tags:
  - security
  - functional
inputs:
  prompt: |
    Perform a design review of the plan in trust-boundary-plan.md (in your working
    directory). Provide critical design feedback on security and trust boundaries.
  context:
    fixture: fixtures/trust-boundary-plan.md
  follow_up_prompts:
    - "Summarise your review conclusion in prose: the single most important risk, its impact rating, and a safer alternative."

graders:
  # Cheap deterministic pre-check (0 judge tokens): the review must reference the
  # trust/security/execution risk and must not wave the plan through.
  - type: text
    name: mentions_trust_boundary
    config:
      regex_match:
        - "(?i)trust|security|untrusted|inject|execut|arbitrary|rce|sandbox|validat"
        - "(?i)allow.?list|string.?only|do not execute|not execut|validation|sandbox"
        - "(?i)high|critical|material|blocking|severe"
      not_contains:
        - "no issues found"
