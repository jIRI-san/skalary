name: continue-implementation
description: Tier-2 LLM evals for the ci (continue-implementation) skill — dependency-aware step selection + atomic execute-then-commit discipline.
skill: ci
schemaVersion: "1.2"
version: "1.0"

config:
  executor: copilot-sdk
  model: gpt-5.6-luna
  trials_per_task: 2
  timeout_seconds: 300
  parallel: false
  # ci is a SKILL (plugins/continue-implementation/skills/ci/SKILL.md). Resolve the REAL
  # skill bundle relative to this eval.yaml (1.0 soft-gate c: skill_directories resolves
  # from the spec file). ../../skills is plugins/continue-implementation/skills, which
  # contains the `ci` skill dir discovered by the `skill:` name above.
  skill_directories:
    - ../../skills
  # inject_skill_body defaults to true (1.0 gate e): the SKILL.md body is injected into
  # the system prompt so the agent carries ci's execute-then-commit discipline. We do NOT
  # set it false — these cases measure the skill's BEHAVIOUR under execution, not whether
  # a `skill` tool is invoked.

tasks:
  - tasks/*.yaml

# No spec-level tool_constraint: ci's SKILL.md frontmatter declares NO `tools:` field, so
# waza auto-injects nothing to suppress (contrast cr/dr, whose agent frontmatter lists VS
# Code tool names). Per-task graders carry the real assertions, including a positive
# tool_calls grader on execute-step-atomically (plan 2.4: assert the build/test tool ran).

# No adversarial block: both ported ci cases are functional execution-discipline scenarios,
# not prompt-injection cases.
