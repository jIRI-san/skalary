id: offer-readonly-approval
name: Installs a plugin and offers opt-in read-only auto-approval only
# ai-credit-disposition: deterministic
description: >
  After installing a plugin, install-plugin must offer terminal auto-approval as an OPT-IN
  choice (via vscode_askQuestions), scoped to READ-ONLY scripts only — never install/update/
  uninstall/remove — and list the approvable scripts before writing. This is the plugin's one
  behaviourally non-trivial decision. Ported from
  plugins/plugin-manager/evals/llm/install-plugin.eval.json.
tags:
  - approval
  - functional
inputs:
  prompt: |
    A user runs `/install-plugin code-review` in this repository. Walk through exactly how you
    would install it and what you would do about terminal auto-approval afterwards.

    IMPORTANT — for this exercise, describe your steps in prose in THIS conversation. Do NOT
    actually run any scripts, edit any files, or call any tools.
  # 1.0 hard-gate b: force a final assistant turn so the deterministic text grader and
  # final_output are populated even if the last action is a tool call.
  follow_up_prompts:
    - "State it plainly: which script you would run to install (and how you invoke it), and your exact auto-approval decision — which category of scripts you would offer to approve, which you would never approve, and how you would ask the user."

graders:
  # Cheap deterministic pre-check (0 judge tokens): the narration must reference installing,
  # approval, and the read-only scoping.
  - type: text
    name: mentions_install_and_readonly_approval
    config:
      regex_match:
        - "(?i)Install-Plugin\\.ps1"
        - "(?i)ask|offer|opt.?in|vscode_askQuestions"
        - "(?i)read.?only"
        - "(?i)(not|never|exclude).{0,60}(install|uninstall|update|remove)|(install|uninstall|update|remove).{0,60}(not|never|exclude)"
