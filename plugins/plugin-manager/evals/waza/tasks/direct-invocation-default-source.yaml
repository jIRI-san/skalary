id: direct-invocation-default-source
name: Invokes the installer directly with -RepoRoot . and the default source
# ai-credit-disposition: deterministic
description: >
  install-plugin must invoke the bundled installer DIRECTLY (never wrapped in `pwsh -File`,
  which breaks terminal auto-approval prefix-matching), always pass -RepoRoot ., and default
  the source to jIRI-san/skalary@main when the user gives none. Ported from
  plugins/plugin-manager/evals/llm/install-plugin.eval.json.
tags:
  - invocation
  - functional
inputs:
  prompt: |
    A user asks you to install the `design-review` plugin but does not specify a repository,
    ref, or local source. Describe the exact command you would run to install it.

    IMPORTANT — for this exercise, answer in prose in THIS conversation. Do NOT actually run
    anything, edit files, or call any tools.
  # 1.0 hard-gate b: force a final assistant turn so the deterministic text grader and
  # final_output are populated even if the last action is a tool call.
  follow_up_prompts:
    - "State the exact invocation plainly: the full script path you would run, how you invoke it (directly or wrapped), the RepoRoot argument, and the default source you would use."

graders:
  # Cheap deterministic pre-check (0 judge tokens): the narration must name the installer
  # script, the RepoRoot argument, and the skalary source.
  - type: text
    name: mentions_installer_reporoot_source
    config:
      regex_match:
        - "(?i)\\.github[/\\\\]skills[/\\\\]install-plugin[/\\\\]scripts[/\\\\]Install-Plugin\\.ps1"
        - "(?i)-RepoRoot\\s+\\."
        - "(?i)jIRI-san/skalary(@main|.*\\bmain\\b)"
      regex_not_match:
        - "(?i)pwsh(?:\\.exe)?\\s+.*-File"
