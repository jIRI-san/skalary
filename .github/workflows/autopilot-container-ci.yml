name: autopilot container

# Post-merge only, and deliberately so.
#
# This workflow builds a candidate's Dockerfile and runs its smoke program. On `pull_request`,
# GitHub reads the workflow definition from the pull request's own head, so the file describing
# that trust boundary is written by the same author as the code it is supposed to contain. A
# candidate could delete the boundary — or the whole job — and the required check would still
# report success, because the check's identity is a name, not a behaviour. An earlier revision
# tried to fix this by executing the runner from a base-SHA checkout; that only moves the
# problem, since the candidate's own YAML decides whether that checkout step runs at all.
#
# GitHub does offer a mechanism where the definition is not candidate-controlled — organization
# required workflows — but this repository has none configured, so it cannot be relied on here.
# What is left that is actually true: a `push` to `main` runs the definition at the merged
# commit, which a reviewer has already accepted. That is a real trust boundary, so this gate is
# a post-merge one. It reports on merged `main`; it does not and cannot block a pull request.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Not `cancel-in-progress`: every merged commit gets its own verdict. Cancelling the run for
  # commit A because commit B landed would leave A merged and unmeasured, which is exactly the
  # state this gate exists to make visible.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.sha }}
  BASE_SHA: ${{ github.event.before }}

jobs:
  detector:
    name: detect container inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevance: ${{ steps.detect.outputs.relevance }}
      candidate_only_reason: ${{ steps.detect.outputs.candidate_only_reason }}
    steps:
      # `github.sha` on a push to `main` is merged, reviewed code, so the candidate checkout is
      # also the trusted source of the runner. There is no separate control-plane checkout,
      # because on this event there is nothing for it to be trusted *against*.
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout event base
        id: base-checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout identities
        shell: pwsh
        env:
          BASE_CHECKOUT_OUTCOME: ${{ steps.base-checkout.outcome }}
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          BASE_ROOT: ${{ github.workspace }}/base
        run: |
          function Assert-CommitSha([string]$Name, [string]$Value) {
            if ($Value -notmatch '^[0-9A-Fa-f]{40}$') { throw "$Name is not a 40-hex commit SHA." }
          }
          function Assert-Head([string]$Name, [string]$Root, [string]$Expected) {
            $actual = (& git -C $Root rev-parse --verify HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or
                -not [string]::Equals($actual, $Expected, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "$Name checkout HEAD does not equal its event SHA."
            }
          }
          Assert-CommitSha -Name CANDIDATE_SHA -Value $env:CANDIDATE_SHA
          Assert-CommitSha -Name BASE_SHA -Value $env:BASE_SHA
          Assert-Head -Name candidate -Root $env:CANDIDATE_ROOT -Expected $env:CANDIDATE_SHA
          if (-not (Test-Path -LiteralPath "$env:CANDIDATE_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -PathType Leaf)) {
            throw 'The merged commit does not contain the container toolchain runner.'
          }
          if ($env:BASE_CHECKOUT_OUTCOME -eq 'success') {
            Assert-Head -Name base -Root $env:BASE_ROOT -Expected $env:BASE_SHA
          }
          else {
            Remove-Item -LiteralPath $env:BASE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Import base commit into candidate clone
        if: steps.base-checkout.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          BASE_ROOT: ${{ github.workspace }}/base
        run: |
          # The runner compares two trees with `git diff <base> <candidate>`, so the base commit
          # object has to exist in the candidate clone. `fetch-depth: 0` used to supply that by
          # cloning the entire history of the repository into two jobs on every push — minutes of
          # transfer to obtain one commit. Fetching that single commit from the base checkout
          # already on disk needs no network and no credentials, which is also why it works for a
          # private repository with `persist-credentials: false`.
          #
          # `continue-on-error` is the honest failure mode: if the import does not happen the
          # runner cannot resolve the base and closes to `base-unreachable`, which forces
          # relevance and a candidate-only measurement. Degrading toward *more* work is safe;
          # failing the job here would only convert a comparison gap into an outage.
          & git -C $env:CANDIDATE_ROOT fetch --no-tags --depth=1 $env:BASE_ROOT $env:BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not import base commit $env:BASE_SHA." }

      - name: Detect image relevance
        id: detect
        shell: pwsh
        env:
          RUNNER_ROOT: ${{ github.workspace }}/candidate
          CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          BASE_ROOT: ${{ github.workspace }}/base
          DETECTOR_RECEIPT: ${{ runner.temp }}/container-toolchain-detect.json
        run: |
          # The runner writes `relevance` and `candidate_only_reason` to $GITHUB_OUTPUT itself.
          # Re-deriving them here meant the closed candidate-only reason set was stated twice —
          # once in `New-ContainerGateReceipt`'s ValidateSet and once in a YAML `-notin` list that
          # nothing kept in step with it.
          & "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -Mode Detect -BaseSha $env:BASE_SHA -CandidateSha $env:CANDIDATE_SHA -BaseRoot $env:BASE_ROOT -CandidateRoot $env:CANDIDATE_ROOT -ReceiptPath $env:DETECTOR_RECEIPT -StepOutputPath $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Container input detection failed.' }

  image:
    name: build and smoke container
    needs: detector
    if: needs.detector.result == 'success' && needs.detector.outputs.relevance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCKER_BUILDKIT: '1'
      BUILDKIT_PROGRESS: plain
      COPILOT_CLI_VERSION: 1.0.60
      EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/container-toolchain
      RUNNER_ROOT: ${{ github.workspace }}/candidate
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      BASE_ROOT: ${{ github.workspace }}/base
      DETECTION_CANDIDATE_ONLY_REASON: ${{ needs.detector.outputs.candidate_only_reason }}
      DETECTION_RELEVANCE: ${{ needs.detector.outputs.relevance }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout event base
        id: base-checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checkout identities
        shell: pwsh
        env:
          BASE_CHECKOUT_OUTCOME: ${{ steps.base-checkout.outcome }}
        run: |
          function Assert-CommitSha([string]$Name, [string]$Value) {
            if ($Value -notmatch '^[0-9A-Fa-f]{40}$') { throw "$Name is not a 40-hex commit SHA." }
          }
          function Assert-Head([string]$Name, [string]$Root, [string]$Expected) {
            $actual = (& git -C $Root rev-parse --verify HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or
                -not [string]::Equals($actual, $Expected, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "$Name checkout HEAD does not equal its event SHA."
            }
          }
          Assert-CommitSha -Name CANDIDATE_SHA -Value $env:CANDIDATE_SHA
          Assert-CommitSha -Name BASE_SHA -Value $env:BASE_SHA
          Assert-Head -Name candidate -Root $env:CANDIDATE_ROOT -Expected $env:CANDIDATE_SHA
          if (-not (Test-Path -LiteralPath "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -PathType Leaf)) {
            throw 'The merged commit does not contain the container toolchain runner.'
          }
          if ($env:BASE_CHECKOUT_OUTCOME -eq 'success') {
            Assert-Head -Name base -Root $env:BASE_ROOT -Expected $env:BASE_SHA
          }
          else {
            Remove-Item -LiteralPath $env:BASE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Initialize terminal evidence
        shell: pwsh
        run: |
          # The placeholder receipt is built by the runner rather than pasted here as a JSON
          # literal, so the schema has one owner and the placeholder names the commits it belongs
          # to. A placeholder that named no commit and no reason told a reader who downloaded the
          # artifact nothing at all.
          New-Item -ItemType Directory -Path $env:EVIDENCE_ROOT -Force | Out-Null
          & "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -Mode Initialize -BaseSha $env:BASE_SHA -CandidateSha $env:CANDIDATE_SHA -ReceiptPath "$env:EVIDENCE_ROOT/receipt.json" -SummaryPath "$env:EVIDENCE_ROOT/summary.md" -Diagnostic 'measurement did not start' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize terminal evidence.' }
          '{"schema":"skalary/container-toolchain-provenance@1","state":"not-produced"}' |
            Set-Content -LiteralPath "$env:EVIDENCE_ROOT/provenance.json" -Encoding utf8NoBOM
          '# container toolchain diagnostics' |
            Set-Content -LiteralPath "$env:EVIDENCE_ROOT/diagnostics.log" -Encoding utf8NoBOM

      - name: Import base commit into candidate clone
        if: steps.base-checkout.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & git -C $env:CANDIDATE_ROOT fetch --no-tags --depth=1 $env:BASE_ROOT $env:BASE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not import base commit $env:BASE_SHA." }

      - name: Measure candidate toolchain
        shell: pwsh
        run: |
          & "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -Mode Measure -BaseSha $env:BASE_SHA -CandidateSha $env:CANDIDATE_SHA -BaseRoot $env:BASE_ROOT -CandidateRoot $env:CANDIDATE_ROOT -DetectionCandidateOnlyReason $env:DETECTION_CANDIDATE_ONLY_REASON -DetectionRelevance $env:DETECTION_RELEVANCE -ReceiptPath "$env:EVIDENCE_ROOT/receipt.json" -ProvenancePath "$env:EVIDENCE_ROOT/provenance.json" -SummaryPath "$env:EVIDENCE_ROOT/summary.md" -DiagnosticLogPath "$env:EVIDENCE_ROOT/diagnostics.log" -CopilotVersion $env:COPILOT_CLI_VERSION -CandidateBudgetSeconds 1500 -BaseBudgetSeconds 600 -RunnerBudgetSeconds 2100 -AdvisoryGrowthMiB 250
          if ($LASTEXITCODE -ne 0) {
            throw 'Candidate container toolchain validation failed.'
          }

      - name: Render encoded result
        if: always()
        shell: pwsh
        run: Get-Content -LiteralPath "$env:EVIDENCE_ROOT/summary.md" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload terminal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopilot-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/container-toolchain/receipt.json
            artifacts/container-toolchain/provenance.json
            artifacts/container-toolchain/summary.md
            artifacts/container-toolchain/diagnostics.log
          if-no-files-found: error
          retention-days: 14

  gate:
    name: autopilot container / gate
    needs:
      - detector
      - image
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUNNER_ROOT: ${{ github.workspace }}/candidate
      FINAL_ROOT: ${{ github.workspace }}/artifacts/container-toolchain-final
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize final receipt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:FINAL_ROOT -Force | Out-Null
          if (-not (Test-Path -LiteralPath "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -PathType Leaf)) {
            throw 'The merged commit does not contain the container toolchain runner.'
          }
          & "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -Mode Initialize -BaseSha $env:BASE_SHA -CandidateSha $env:CANDIDATE_SHA -ReceiptPath "$env:FINAL_ROOT/receipt.json" -SummaryPath "$env:FINAL_ROOT/summary.md" -Diagnostic 'final verification did not start' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the final receipt.' }

      - name: Verify final result
        shell: pwsh
        env:
          DETECTOR_CONCLUSION: ${{ needs.detector.result }}
          RELEVANCE: ${{ needs.detector.outputs.relevance }}
          IMAGE_CONCLUSION: ${{ needs.image.result }}
        run: |
          & "$env:RUNNER_ROOT/scripts/skalary/Invoke-ContainerToolchainGate.ps1" -Mode VerifyResult -DetectorConclusion $env:DETECTOR_CONCLUSION -Relevance $env:RELEVANCE -ImageConclusion $env:IMAGE_CONCLUSION -ReceiptPath "$env:FINAL_ROOT/receipt.json" -SummaryPath "$env:FINAL_ROOT/summary.md"
          if ($LASTEXITCODE -ne 0) {
            throw 'Autopilot container result combination failed closed.'
          }

      - name: Render final encoded result
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "$env:FINAL_ROOT/summary.md" -PathType Leaf) {
            Get-Content -LiteralPath "$env:FINAL_ROOT/summary.md" |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload final receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopilot-container-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/container-toolchain-final/receipt.json
          if-no-files-found: error
          retention-days: 14
